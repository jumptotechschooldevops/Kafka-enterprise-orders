apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Aisalkyn85/kafka-enterprise-orders.git'
    targetRevision: main
    path: k8s/charts/webapp
    helm:
      # Do not put credentials in this file. Supply secrets via Argo CD
      # Helm parameters, a gitignored values file, or External Secrets.
      values: |
        frontendImage: "ghcr.io/aisalkyn85/kafka-enterprise-orders/web-frontend:latest"
        backendImage: "ghcr.io/aisalkyn85/kafka-enterprise-orders/web-backend:latest"
        backendPort: 8000
        replicaCount: 1
        ghcr:
          enabled: false
        ingress:
          host: "orders.jumptotech.net"
          certificateArn: "<set-via-helm-values-or-external-secret>"
        couchbase:
          host: "<set-via-helm-values-or-external-secret>"
          bucket: "order_analytics"
          username: "<set-via-helm-values-or-external-secret>"
          password: "<set-via-helm-values-or-external-secret>"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
