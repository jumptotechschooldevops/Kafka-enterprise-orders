global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"

  - job_name: "fraud-service"
    static_configs:
      - targets: ["fraud-service:8001"]
    metrics_path: "/metrics"

  - job_name: "payment-service"
    static_configs:
      - targets: ["payment-service:8002"]
    metrics_path: "/metrics"

  - job_name: "analytics-service"
    static_configs:
      - targets: ["analytics-service:8003"]
    metrics_path: "/metrics"

  - job_name: "dlq-consumer"
    static_configs:
      - targets: ["dlq-consumer:8004"]
    metrics_path: "/metrics"
