services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "5"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/create_local_topics.sh:/create_local_topics.sh:ro
    entrypoint: ["/bin/bash", "/create_local_topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    restart: "no"

  couchbase:
    image: couchbase:community-7.2.0
    container_name: couchbase
    ports:
      - "8091-8096:8091-8096"
      - "11210:11210"
    volumes:
      - couchbase_data:/opt/couchbase/var
    environment:
      COUCHBASE_ADMINISTRATOR_USERNAME: ${COUCHBASE_USERNAME:-Administrator}
      COUCHBASE_ADMINISTRATOR_PASSWORD: ${COUCHBASE_PASSWORD:-password}
    healthcheck:
      # /pools returns 401 on an initialized cluster without creds; that still means the HTTP API is up.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8091/pools | grep -E '^(200|401)$'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  couchbase-init:
    image: curlimages/curl:latest
    container_name: couchbase-init
    depends_on:
      couchbase:
        condition: service_healthy
    volumes:
      - ./db/init-couchbase.sh:/init-couchbase.sh
    entrypoint: ["/bin/sh", "/init-couchbase.sh"]
    environment:
      COUCHBASE_HOST: couchbase
      COUCHBASE_PORT: 8091
      COUCHBASE_USERNAME: ${COUCHBASE_USERNAME:-Administrator}
      COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD:-password}
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET:-order_analytics}
    restart: "no"

  producer:
    build: ./producer
    container_name: producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    restart: on-failure

  fraud-service:
    build: ./consumers/fraud-service
    container_name: fraud-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      METRICS_PORT: 8001
    restart: on-failure

  payment-service:
    build: ./consumers/payment-service
    container_name: payment-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8002:8002"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      METRICS_PORT: 8002
    restart: on-failure

  analytics-service:
    build: ./consumers/analytics-service
    container_name: analytics-service
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      couchbase-init:
        condition: service_completed_successfully
    ports:
      - "8003:8003"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      COUCHBASE_HOST: couchbase
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET:-order_analytics}
      COUCHBASE_USERNAME: ${COUCHBASE_USERNAME:-Administrator}
      COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD:-password}
      METRICS_PORT: 8003
    restart: on-failure

  dlq-consumer:
    build: ./consumers/dlq-consumer
    container_name: dlq-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8004:8004"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      METRICS_PORT: 8004
    restart: on-failure

  backend:
    build: ./web/backend
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      COUCHBASE_HOST: couchbase
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET:-order_analytics}
      COUCHBASE_USERNAME: ${COUCHBASE_USERNAME:-Administrator}
      COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD:-password}
      API_KEYS: ${API_KEYS:-dev-key-change-me}
    depends_on:
      couchbase-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure

  frontend:
    build: ./web/frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY:-dev-key-change-me}
    restart: unless-stopped

  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      SERVER_SERVLET_CONTEXTPATH: "/"
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  couchbase_data:
  grafana_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
