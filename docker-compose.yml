services:
  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Couchbase (local)
  # Note: On first run, Couchbase needs manual setup:
  # 1. Open http://localhost:8091
  # 2. Complete the setup wizard (or skip)
  # 3. Login: Administrator / password
  # 4. Go to Buckets → Create Bucket → Name: order_analytics → Create
  couchbase:
    image: couchbase:community-7.2.0
    container_name: couchbase
    ports:
      - "8091-8096:8091-8096"
      - "11210:11210"
    volumes:
      - couchbase_data:/opt/couchbase/var
    environment:
      - COUCHBASE_ADMINISTRATOR_USERNAME=Administrator
      - COUCHBASE_ADMINISTRATOR_PASSWORD=password
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/pools"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Couchbase initialization - creates bucket automatically
  couchbase-init:
    image: curlimages/curl:latest
    container_name: couchbase-init
    depends_on:
      - couchbase
    volumes:
      - ./db/init-couchbase.sh:/init-couchbase.sh
    entrypoint: ["/bin/sh", "/init-couchbase.sh"]
    environment:
      COUCHBASE_HOST: couchbase
      COUCHBASE_PORT: 8091
      COUCHBASE_USERNAME: Administrator
      COUCHBASE_PASSWORD: password
      COUCHBASE_BUCKET: order_analytics
    restart: "no"

  # Producer - generates orders
  producer:
    build: ./producer
    container_name: producer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    restart: on-failure

  # Fraud detection consumer — metrics on :8001
  fraud-service:
    build: ./consumers/fraud-service
    container_name: fraud-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      METRICS_PORT: 8001
    restart: on-failure

  # Payment processing consumer — metrics on :8002
  payment-service:
    build: ./consumers/payment-service
    container_name: payment-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      METRICS_PORT: 8002
    restart: on-failure

  # Analytics consumer — writes to Couchbase, metrics on :8003
  analytics-service:
    build: ./consumers/analytics-service
    container_name: analytics-service
    depends_on:
      kafka:
        condition: service_healthy
      couchbase:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      COUCHBASE_HOST: couchbase
      COUCHBASE_BUCKET: order_analytics
      COUCHBASE_USERNAME: Administrator
      COUCHBASE_PASSWORD: password
      METRICS_PORT: 8003
    restart: on-failure

  # DLQ consumer — reads all *-dlq topics, alerts on failures
  dlq-consumer:
    build: ./consumers/dlq-consumer
    container_name: dlq-consumer
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      METRICS_PORT: 8004
      # ALERT_WEBHOOK_URL: https://hooks.slack.com/services/your/webhook/url
    restart: on-failure

  # Backend API — metrics at /metrics, auth via X-API-Key header
  backend:
    build: ./web/backend
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      COUCHBASE_HOST: couchbase
      COUCHBASE_BUCKET: order_analytics
      COUCHBASE_USERNAME: Administrator
      COUCHBASE_PASSWORD: password
      API_KEYS: dev-key-change-me
    depends_on:
      couchbase:
        condition: service_healthy
    restart: on-failure

  # Frontend UI
  frontend:
    build: ./web/frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000

  # Kafdrop - Kafka UI
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      SERVER_SERVLET_CONTEXTPATH: "/"
    restart: on-failure

  # Prometheus — scrapes metrics from all services
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped

  # Grafana — dashboards auto-provisioned from monitoring/grafana/
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  couchbase_data:
  grafana_data:
