name: ECS Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: kafka-backend
  ECS_CLUSTER: kafka-enterprise-orders-cluster
  ECS_SERVICE: kafka-enterprise-orders-backend-svc
  CONTAINER_NAME: backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 AWS LOGIN
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 🔐 ECR LOGIN
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 🏗️ BUILD IMAGE
      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY:latest ./web/backend

      # 🏷️ TAG IMAGE
      - name: Tag Docker image
        run: |
          docker tag $ECR_REPOSITORY:latest 021399177326.dkr.ecr.us-east-2.amazonaws.com/$ECR_REPOSITORY:latest

      # 📤 PUSH IMAGE
      - name: Push to ECR
        run: |
          docker push 021399177326.dkr.ecr.us-east-2.amazonaws.com/$ECR_REPOSITORY:latest

      # 🔄 FORCE ECS DEPLOYMENT
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

